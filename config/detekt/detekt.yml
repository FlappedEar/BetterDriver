# Overrides on top of detekt's default rules.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    # detekt's default test folders, plus the app's debug-only tests (FBBD-41).
    excludes: ['**/test/**', '**/testDebug/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
