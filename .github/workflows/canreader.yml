name: FR-S reader

# Publishes the FR-S CAN/OBD reader (FBBD-319), a separate test APK (tools/canreader), as the
# pre-release canreader-vX.Y.Z, X.Y.Z being versionName in tools/canreader/build.gradle.kts. Never
# marked latest and not a vX.Y.Z tag, so the app's releases, its in-app updater and release.yml do
# not see it. Runs on main when the reader changes, or from the Actions tab; a run for a version
# that is already published replaces its APK. Signed with the release key like the app (the
# reader's own applicationId, so it installs beside the app), in a job that runs no project code.
on:
  push:
    branches: [main]
    paths: ['tools/canreader/**', '.github/workflows/canreader.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canreader
  cancel-in-progress: false

env:
  RELEASE_CERT_SHA256: 0e12358c264f8fa04e448098cb1ed0302256a1e749018a2d2065fea17167ec05

jobs:
  build:
    name: Build the reader APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\([0-9.]*\)"$/\1/p' tools/canreader/build.gradle.kts)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::No versionName in tools/canreader/build.gradle.kts."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: ./gradlew :tools:canreader:test :tools:canreader:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: canreader-unsigned
          path: tools/canreader/build/outputs/apk/release/canreader-release.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign the reader APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: canreader-unsigned
          path: unsigned
      - name: Write the release key from the secret
        id: secret
        uses: ./.github/actions/signing-key-from-secret
        with:
          expected-sha256: ${{ env.RELEASE_CERT_SHA256 }}
          keystore-base64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      - name: Stop if the signing key is missing
        if: steps.secret.outputs.restored != 'true'
        run: |
          echo "::error::The secret ANDROID_RELEASE_KEYSTORE_BASE64 is not set."
          exit 1
      - name: Sign
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir dist
          bash .github/scripts/sign-apk.sh unsigned/canreader-release.apk "$RUNNER_TEMP/release.keystore" "dist/FRS-Reader-$VERSION.apk"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: canreader-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish canreader-v${{ needs.build.outputs.version }}
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canreader-signed
          path: dist
      - name: Create the pre-release, or replace its APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="canreader-v$VERSION"
          (cd dist && sha256sum FRS-Reader-* > SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          cat > notes.md <<NOTES
          FR-S CAN/OBD reader $VERSION (FBBD-319): a separate test tool, not the BetterDriver app. It installs beside the app.

          It connects to the Vgate vLinker over Bluetooth LE and writes a plain-text log of what the car gives: OBD-II PIDs and their rates, the FR-S wish list requests, trouble codes (read only), a mode 21 sweep and the CAN ids at the OBD port with their frames.

          Install: download FRS-Reader-$VERSION.apk on the phone and open it. Checksums are in SHA256SUMS.txt.
          NOTES
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FR-S reader $VERSION (test tool)" \
            --prerelease --latest=false \
            --notes-file notes.md
