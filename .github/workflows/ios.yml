name: iOS

# The iPhone/iPad app (FBBD-328) on a macOS runner: the Kotlin core modules' common
# tests on the iOS simulator (ci.yml runs their JVM tests), the XCFramework, and the
# SwiftUI app's unit tests on an iPad and an iPhone simulator. Runs when the app, a core
# module with iOS targets or the build changes.
on:
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - "recorder/**"
      - "core-ios/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "shared/**"
      - "recorder/**"
      - "core-ios/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    name: iOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The Kotlin/Native compiler and its iOS toolchain (~1 GB) are downloaded once per Kotlin version.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
      # One iPad and one iPhone simulator that exist on this runner image (names change with Xcode).
      - name: Pick simulators
        id: sim
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          runtimes = json.load(open("devices.json"))["devices"]
          ios = sorted((k for k in runtimes if "iOS" in k), key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")])
          devices = runtimes[ios[-1]]
          ipad = next(d for d in devices if d["name"].startswith("iPad"))
          iphone = next(d for d in devices if d["name"].startswith("iPhone"))
          print(f"ipad={ipad['udid']}")
          print(f"iphone={iphone['udid']}")
          print(f"names={ipad['name']} / {iphone['name']} ({ios[-1]})")
          EOF
      - name: Simulators
        run: echo "${{ steps.sim.outputs.names }}"
      - name: Shared core on the iOS simulator
        run: >
          ./gradlew -Pbetterdriver.coreOnly -PiosSimulator=${{ steps.sim.outputs.iphone }}
          iosSimulatorArm64Test :core-ios:assembleBetterDriverCoreDebugXCFramework
          --stacktrace
      - name: Generate the Xcode project
        run: SKIP_CORE=1 ios/generate.sh
      # The full log goes to the artifact; the step log keeps the errors and test results.
      - name: App unit tests (iPad + iPhone)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project ios/BetterDriver.xcodeproj \
            -scheme BetterDriver \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.ipad }}" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone }}" \
            -resultBundlePath build/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed [0-9]+ test|\*\* (TEST|BUILD) " build/xcodebuild.log || true
          exit $status
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/ios-tests.xcresult
            build/xcodebuild.log
            */build/reports/tests
          if-no-files-found: ignore
