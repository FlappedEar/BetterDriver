name: iOS

# The iPhone/iPad app (FBBD-328) on macOS runners: the Kotlin core modules' common
# tests on the iOS simulator (ci.yml runs their JVM tests), the XCFramework, and the
# SwiftUI app's unit and UI tests on an iPad and an iPhone simulator. Runs when the app, a core
# module with iOS targets or the build changes: every module core-ios exports is listed in both
# path filters below, which ci.yml's Changes job checks.
#
# One job builds the core and the app once; four jobs then run the tests at the same time
# (iPad and iPhone, each in two halves) from that build. Before, one runner ran both devices
# one after the other: ~90 min, 63 of them UI tests. The last job, "iOS app", passes only when
# every test job passed.
on:
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - "setup/**"
      - "recorder/**"
      - "racebox/**"
      - "obd/**"
      - "heartrate/**"
      - "tpms/**"
      - "gnss/**"
      - "timing/**"
      - "coach/**"
      - "analysis/**"
      - "videosync/**"
      - "transfer/**"
      - "core-ios/**"
      # The track screen's fonts, bundled into the app.
      - "core-ui/src/main/res/font/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/ios-simulator.py"
      - ".github/ios-runner.json"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "shared/**"
      - "setup/**"
      - "recorder/**"
      - "racebox/**"
      - "obd/**"
      - "heartrate/**"
      - "tpms/**"
      - "gnss/**"
      - "timing/**"
      - "coach/**"
      - "analysis/**"
      - "videosync/**"
      - "transfer/**"
      - "core-ios/**"
      # The track screen's fonts, bundled into the app.
      - "core-ui/src/main/res/font/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/ios-simulator.py"
      - ".github/ios-runner.json"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main a running run is never cancelled,
# but a queued one is dropped when a newer merge queues behind it (FBBD-457): nothing waits for a
# given main commit's iOS run (release.yml gates on ci.yml, ios-release.yml runs its own iPhone
# UI gate), and each full run costs ~80 minutes of the Mac minis.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # FBBD-434: which machine runs the iOS jobs. .github/ios-runner.json holds the runner labels:
  # "macos-15" (GitHub's runners) or ["self-hosted","bd-mac"] (Arek's Mac mini). Pull requests from
  # forks always get GitHub's runners: the repository is public, and a self-hosted runner must never
  # run code from outside.
  #
  # FBBD-457: two more decisions, both to keep the two Mac minis free for pull requests.
  # - Overflow: a pull request run goes to GitHub's macos-15 when another unfinished iOS run already
  #   uses the Mac minis: one run's 4 test shards fill both of them for ~40 min. Same tests, same
  #   "iOS app" gate; fork PRs run there too.
  # - Reuse on main: a push to main skips the build and the tests when the merged pull request's
  #   run passed on the very same source tree: its "iOS passed (tree ...)" job names the tree it
  #   tested (the PR's merge commit), as ci.yml's "CI passed (tree ...)" does for release.yml.
  #   A merge whose tree no PR run tested runs in full.
  runner:
    name: iOS runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      tree: ${{ steps.pick.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Pick the runner
        id: pick
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          labels=$(python3 -c 'import json; print(json.dumps(json.load(open(".github/ios-runner.json"))))')
          if [ "$FORK" = true ]; then labels='"macos-15"'; fi
          if [ "$EVENT" = pull_request ] && [ "$labels" != '"macos-15"' ]; then
            # Other unfinished iOS runs with a job for the Mac minis (a main run that reuses its
            # pull request's result has none).
            busy=0
            for status in queued in_progress; do
              for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?status=$status&per_page=50" \
                  --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id" || true); do
                n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=20" \
                  --jq '[.jobs[] | select(.labels | index("bd-mac"))] | length' || echo 0)
                if [ "${n:-0}" -gt 0 ] 2>/dev/null; then busy=$((busy + 1)); fi
              done
            done
            echo "Other iOS runs using the Mac minis: $busy"
            if [ "$busy" -ge 1 ]; then
              echo "Mac minis busy: this pull request runs on GitHub's macos-15 (FBBD-457)."
              labels='"macos-15"'
            fi
          fi
          echo "iOS jobs run on: $labels"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          # The source tree the build checks out (a pull request's merge commit), for the
          # "iOS passed (tree ...)" job.
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: A pull request run of this same tree that passed
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reuse=false
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          echo "Tree of $GITHUB_SHA: $tree"
          for head in $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[] | select(.merged_at != null) | .head.sha' || true); do
            # The tree the pull request run actually tested (its merge commit), not the head's.
            url=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" -f check_name="iOS passed (tree $tree)" \
              --jq '[.check_runs[] | select(.conclusion == "success")][0].html_url // empty' || true)
            if [ -n "$url" ]; then
              echo "iOS passed on this exact tree in the pull request run: $url"
              reuse=true
              break
            fi
            echo "No pull request run of pull request head $head passed on tree $tree."
          done
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  build:
    name: iOS build
    needs: runner
    if: needs.runner.outputs.reuse != 'true'
    # FBBD-434: GitHub's macos-15 or Arek's Mac mini, as the runner job picks.
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # A self-hosted Mac keeps ~/.gradle and ~/.konan between runs: restoring GitHub's cache
      # over them only costs time.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
      # The Kotlin/Native compiler and its iOS toolchain (~1 GB) are downloaded once per Kotlin version.
      - uses: actions/cache@v4
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Tools
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
      - name: Pick a simulator
        id: sim
        run: python3 .github/scripts/ios-simulator.py iPhone ${{ runner.environment == 'self-hosted' && '--private' || '' }} >> "$GITHUB_OUTPUT"
      - name: Simulator
        run: echo "${{ steps.sim.outputs.name }}"
      # Only the simulator slice of the core: the tests never run on a device (ios-release.yml
      # builds the device slice). Wrapped as the XCFramework the Xcode project links.
      - name: Shared core on the iOS simulator
        run: |
          ./gradlew -Pbetterdriver.coreOnly -PiosSimulator=${{ steps.sim.outputs.udid }} \
            iosSimulatorArm64Test :core-ios:linkDebugFrameworkIosSimulatorArm64 --stacktrace
          rm -rf core-ios/build/XCFrameworks/debug
          xcodebuild -create-xcframework \
            -framework core-ios/build/bin/iosSimulatorArm64/debugFramework/BetterDriverCore.framework \
            -output core-ios/build/XCFrameworks/debug/BetterDriverCore.xcframework
      - name: Generate the Xcode project
        run: SKIP_CORE=1 ios/generate.sh
      # The full log goes to the artifact; the step log keeps the errors.
      - name: Build the app and its tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project ios/BetterDriver.xcodeproj \
            -scheme BetterDriver \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild-build.log 2>&1 && status=0 || status=$?
          grep -E "error:|\*\* (TEST BUILD|BUILD) " build/xcodebuild-build.log || true
          exit $status
      # A tar keeps the app's symlinks and executable bits, which an artifact's zip drops.
      - name: Pack the build
        run: tar -cf build/products.tar -C build/dd/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/products.tar
          retention-days: 1
          compression-level: 1
      - name: Build results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-results
          path: |
            build/xcodebuild-build.log
            */build/reports/tests
          if-no-files-found: ignore
      # The job's own simulator on a self-hosted Mac (FBBD-434).
      - name: Delete the job's simulator
        if: always() && runner.environment == 'self-hosted' && steps.sim.outputs.udid != ''
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true

  test:
    name: iOS tests (${{ matrix.device }} ${{ matrix.part }})
    needs: [runner, build]
    if: needs.runner.outputs.reuse != 'true'
    # Same runner as the build job (FBBD-434).
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    # The slowest half took ~17 min on the iPad (PR #456): room for a slow runner.
    timeout-minutes: 60
    strategy:
      # Report every failing half, not only the first one.
      fail-fast: false
      matrix:
        device: [iPad, iPhone]
        part: [1, 2]
    env:
      # Part 1 runs these UI test classes (about half the UI tests' time); part 2 runs everything
      # else, so a new test class always runs.
      PART1: >-
        BetterDriverUITests/ReviewScreensTests
        BetterDriverUITests/ScreenLayoutTests
        BetterDriverUITests/DataVideoTests
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Pick a simulator
        id: sim
        run: python3 .github/scripts/ios-simulator.py ${{ matrix.device }} ${{ runner.environment == 'self-hosted' && '--private' || '' }} >> "$GITHUB_OUTPUT"
      # Boots while the build downloads.
      - name: Boot ${{ steps.sim.outputs.name }}
        run: nohup xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b > /dev/null 2>&1 &
      - uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: build
      - name: Unpack the build
        run: |
          mkdir -p build/dd/Build
          tar -xf build/products.tar -C build/dd/Build
      # The full log goes to the artifact; the step log keeps the errors and test results.
      - name: Tests (${{ matrix.device }} ${{ matrix.part }})
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.part }}" = 1 ]; then flag=-only-testing; else flag=-skip-testing; fi
          selection=()
          for t in $PART1; do selection+=("$flag:$t"); done
          xctestrun=$(ls build/dd/Build/Products/*.xctestrun | head -n 1)
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            "${selection[@]}" \
            -resultBundlePath build/ios-tests.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 600 \
            > build/xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed [0-9]+ test|\*\* (TEST|BUILD) " build/xcodebuild.log || true
          xcrun xcresulttool get test-results summary --path build/ios-tests.xcresult > build/summary.json || true
          sed -n '/SMOKE app:/,/Test Case .*failed/p' build/xcodebuild.log | head -n 300 || true
          python3 -c 'import json; d=json.load(open("build/summary.json")); print("RESULT", d.get("result"), d.get("passedTests"), "passed", d.get("failedTests"), "failed"); [print("FAILED", json.dumps(f)) for f in d.get("testFailures", [])]' || head -c 3000 build/summary.json
          exit $status
      # The UI tests' screenshots of the demo sessions' review (FBBD-331), one PNG per tab and device.
      - name: Review screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/ios-tests.xcresult --output-path build/screenshots || true
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-review-screenshots-${{ matrix.device }}-${{ matrix.part }}
          path: build/screenshots
          if-no-files-found: ignore
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ matrix.device }}-${{ matrix.part }}
          path: |
            build/ios-tests.xcresult
            build/xcodebuild.log
          if-no-files-found: ignore
      # The job's own simulator on a self-hosted Mac (FBBD-434).
      - name: Delete the job's simulator
        if: always() && runner.environment == 'self-hosted' && steps.sim.outputs.udid != ''
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true

  passed:
    name: iOS app
    needs: [runner, build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every iOS job passed
        run: |
          echo "runner: ${{ needs.runner.result }}, build: ${{ needs.build.result }}, tests: ${{ needs.test.result }}, reused: ${{ needs.runner.outputs.reuse }}"
          [ "${{ needs.runner.result }}" = success ] || exit 1
          # FBBD-457: on main, the pull request run of the same tree already passed.
          if [ "${{ needs.runner.outputs.reuse }}" = true ]; then exit 0; fi
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.test.result }}" = success ]

  # FBBD-457: the same result, named after the source tree the run tested. A push to main with
  # that tree reuses it instead of running the build and the tests again (runner job above).
  tested-tree:
    name: iOS passed (tree ${{ needs.runner.outputs.tree }})
    needs: [runner, passed]
    if: needs.passed.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Tree
        run: echo "iOS passed on tree ${{ needs.runner.outputs.tree }}"
