name: iOS release

# Builds the iPhone/iPad app for the App Store and uploads it to TestFlight (FBBD-334).
#
# Gate: nothing is archived or uploaded unless the UI smoke test passes first on an iPhone
# simulator (BetterDriverUITests: fresh install, START with camera, OBD, heart rate and coach on,
# stop, open the saved session).
#
# Runs after each successful Release (the Android release, same version and commit) and
# from the Actions tab. Signing is automatic from the App Store Connect API key in the
# secrets ASC_ISSUER_ID, ASC_KEY_ID and ASC_KEY_P8; the team id comes from the bundle id,
# which the first run registers. Without those secrets the run archives the app unsigned,
# which proves the release build, and uploads nothing; so does a pull request.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
  # A change to this workflow checks the unsigned release archive; pull requests never upload.
  pull_request:
    paths:
      - ".github/workflows/ios-release.yml"
      - "ios/ci/**"

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  BUNDLE_ID: com.flappedear.betterdriver

jobs:
  testflight:
    name: TestFlight
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The released commit; its commit count is the build number, as on Android.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Signing ready?
        id: signing
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect API key not in the secrets: archiving unsigned, no upload."
          fi
      - name: Version and build number
        id: version
        run: |
          echo "version=$(sed -n 's/^betterdriver.version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      # App Store Connect takes only builds made with the iOS 26 SDK or later (Xcode 26+).
      - name: Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          [ -n "$xcode" ] || { echo "::error::No Xcode 26 on this runner image"; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Shared core (release) and the Xcode project
        env:
          BETTERDRIVER_CORE_BUILD: release
        run: ios/generate.sh
      - name: Smoke test on the iPhone simulator (gate)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          sim=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in runtimes if "iOS" in k), key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          xcodebuild test \
            -project ios/BetterDriver.xcodeproj -scheme BetterDriver \
            -destination "platform=iOS Simulator,id=$sim" \
            -only-testing:BetterDriverUITests \
            -resultBundlePath build/smoke.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/smoke.log 2>&1 && status=0 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed [0-9]+ test|\*\* (TEST|BUILD) " build/smoke.log || true
          if [ $status -ne 0 ]; then
            # The test prints what was on screen when it failed.
            sed -n '/SMOKE app:/,/Test Case .*failed/p' build/smoke.log | head -n 400
            echo "::error::Smoke test failed: nothing goes to TestFlight"
          fi
          exit $status
      - name: Smoke test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            build/smoke.xcresult
            build/smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: App Store Connect key and team
        id: team
        if: steps.signing.outputs.ready == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          python3 -m pip install --quiet --break-system-packages 'pyjwt[crypto]==2.10.1'
          team=$(ASC_KEY_PATH="$key" python3 ios/ci/asc.py team "$BUNDLE_ID" BetterDriver)
          # The Live Activity's widget extension (UI-284 A) signs with its own App ID.
          ASC_KEY_PATH="$key" python3 ios/ci/asc.py team "$BUNDLE_ID.LiveActivity" "BetterDriver Live Activity" > /dev/null
          echo "id=$team" >> "$GITHUB_OUTPUT"
          # Development certificates earlier runners made (their keys are gone) fill the account's limit.
          ASC_KEY_PATH="$key" python3 ios/ci/asc.py ci-certs
      - name: Archive (signed)
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/BetterDriver.xcodeproj -scheme BetterDriver -configuration Release \
            -destination generic/platform=iOS -archivePath build/BetterDriver.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.team.outputs.key }}" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ steps.team.outputs.id }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" 2>&1 | tail -n 60
      - name: Archive (unsigned check)
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/BetterDriver.xcodeproj -scheme BetterDriver -configuration Release \
            -destination generic/platform=iOS -archivePath build/BetterDriver.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" 2>&1 | tail -n 60
      # App Store Connect warns when an extension's version or build differs from the app's (ITMS-90473).
      - name: Bundle versions match
        shell: bash
        run: |
          app=build/BetterDriver.xcarchive/Products/Applications/BetterDriver.app
          want="${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }})"
          status=0
          shopt -s nullglob
          for plist in "$app/Info.plist" "$app"/PlugIns/*.appex/Info.plist; do
            got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"))"
            echo "$plist: $got"
            [ "$got" = "$want" ] || { echo "::error::$plist is $got, not $want"; status=1; }
          done
          exit $status
      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ steps.team.outputs.id }}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          # Xcode writes its distribution logs under TMPDIR; keep them for the artifact below.
          export TMPDIR="$RUNNER_TEMP/xcdist/" && mkdir -p "$TMPDIR"
          xcodebuild -exportArchive \
            -archivePath build/BetterDriver.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.team.outputs.key }}" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tail -n 60
          echo "### TestFlight: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) uploaded" >> "$GITHUB_STEP_SUMMARY"
      # The archive made a development certificate this runner takes with it.
      - name: Revoke this run's development certificate
        if: always() && steps.team.outputs.key != ''
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: ASC_KEY_PATH="${{ steps.team.outputs.key }}" python3 ios/ci/asc.py ci-certs
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      # Xcode's distribution logs say why signing or the upload was refused.
      - name: Distribution logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcdistributionlogs
          path: ${{ runner.temp }}/xcdist/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 3
