name: CI

# Unit tests, Android lint, detekt, the APK build and the emulator smoke tests
# on every pull request and on main. They run as parallel jobs, so the slowest
# one sets the wait. Any
# failing job fails the run, and release.yml only publishes a commit whose
# whole run succeeded.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Report every failing check, not only the first one.
      fail-fast: false
      matrix:
        include:
          # Also compares the screenshot tests of core-ui and feature-track
          # with their goldens (screenshots.yml records them).
          - name: Unit tests
            tasks: test -Proborazzi.test.verify=true
            robolectric: true
          - name: Android lint
            tasks: lint
          - name: detekt
            tasks: detekt
          # assemble builds the debug and release variants of every module;
          # the release build also runs lintVitalRelease.
          - name: Build APKs
            tasks: assemble
            apk: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count (git rev-list --count HEAD),
          # which needs the full history. Only the APK job stamps it; the
          # other jobs use a shallow clone and the default build number 1.
          # (A quoted '0': a bare 0 is falsy and would select 1.)
          fetch-depth: ${{ matrix.apk && '0' || '1' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Also validates the Gradle wrapper jar. Caches are written on main
      # and read by pull requests.
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads its Android framework jar on the first run.
      - uses: actions/cache@v4
        if: matrix.robolectric
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', '**/robolectric.properties') }}
      - name: Build number
        id: build
        if: matrix.apk
        run: echo "args=-Pbetterdriver.build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }} ${{ steps.build.outputs.args }} --continue --stacktrace
      # Failed tests as annotations on the run, readable without the log.
      - name: Annotate failed tests
        if: failure() && matrix.robolectric
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('message') or bad.text or '').strip().replace('\n', ' ')[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      # The coach on every lap of Arek's built-in Silesia Ring drive (DemoDriveReplayTest), on the summary page.
      - name: Coach replay report
        if: always() && matrix.robolectric
        run: cat analysis/build/reports/replay-drive/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.name }}
          # Roborazzi writes the actual and diff images of failed screenshots to build/outputs/roborazzi.
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7
      # Pictures of the main screens on phone and tablet from the layout tests (FBBD-40), to look
      # at; the tests themselves check them, so they have no goldens.
      - name: Upload layout screenshots
        if: always() && matrix.robolectric
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: '**/build/outputs/roborazzi/layout/'
          if-no-files-found: ignore
          retention-days: 14
      # Pull requests do not keep the APK; run CI manually on a branch to get one.
      - name: Upload the debug APK
        if: matrix.apk && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: betterdriver-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Emulator smoke tests (FBBD-161): boots an Android 14 emulator, installs the
  # debug app on realistic seeded data (no Bluetooth, GPS or camera), opens
  # every screen and the 0.3.0 flows, and fails on any crash or ANR. Runs
  # beside the checks above; one emulator and one Gradle invocation. Then it
  # kills the UI process during a recording (FBBD-72, ui-kill.sh), injects
  # faults into a recording (FBBD-34, 69, 43, 64, 63, faults.sh) and runs the
  # permissions flow (FBBD-35, permissions.sh).
  emulator:
    name: Emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AVD_KEY: avd-34-google_apis-x86_64-pixel_6-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Hardware acceleration for the emulator, as the emulator runner's README says.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The AVD and its booted snapshot, so later runs skip the cold boot.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Created the AVD snapshot for the cache."
      - name: Smoke tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh
      - name: Upload logcat and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            build/emulator/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  # Arek's Demo track drive, done by CI instead of by him (FBBD-192): the Silesia Ring laps built into
  # the app (his 27 Sep 2026 sessions) replayed through the whole app on an emulator for 22 minutes,
  # coach at Full in Polish, then the app's continuous log checked as his shared logs are: the drive
  # checks and what the coach said lap by lap (FBBD-244, 242, 243, 245). replay-drive.sh; the report
  # is on the run's summary page and in the replay-drive artifact.
  replay:
    name: Replay drive
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AVD_KEY: avd-34-google_apis-x86_64-pixel_6-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Built before the emulator starts, so the drive does not wait for Gradle.
      - name: Build the app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Created the AVD snapshot for the cache."
      - name: Replay drive
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/replay-drive.sh
      - name: Upload the report, log and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-drive
          path: build/replay-drive/
          if-no-files-found: ignore
          retention-days: 14
