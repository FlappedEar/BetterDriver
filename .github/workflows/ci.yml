name: CI

# Unit tests, Android lint, detekt, the APK build and the emulator smoke tests
# on every pull request and on main. They run as parallel jobs, so the slowest
# one sets the wait. Any failing job fails the run, and the last job, "CI passed",
# names the source tree it checked. release.yml publishes a commit only when a
# CI run of that commit, or a pull request run of the very same tree, passed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main every commit keeps
# its own run (grouped by commit): a release may be waiting for it, and a merge
# must never cancel it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, and the source tree this run checks. A change to documentation
  # only (docs/ and Markdown files outside src/) skips the emulator jobs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          app=true
          # A manual run, a new branch or an unknown base checks everything.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] \
            && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            if [ -n "$files" ] && ! grep -vE '^docs/|^([^/]+/)*[^/]+\.md$' <<<"$files" | grep -q . \
              && ! grep -E '\.md$' <<<"$files" | grep -q '/src/'; then
              app=false
              echo "::notice title=Docs only::Only documentation changed; the emulator jobs are skipped."
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
      # A module the iOS app exports that ios.yml does not watch would let a change to its iOS code
      # through untested (audit BD-08): each one must be in both of ios.yml's path filters.
      - name: iOS workflow watches every exported module
        run: |
          mods=$(sed -n 's/^val exported = listOf(\(.*\))$/\1/p' core-ios/build.gradle.kts | tr -d '": ' | tr , '\n' | sed 's/^://')
          [ -n "$mods" ] || { echo "::error::no exported modules found in core-ios/build.gradle.kts"; exit 1; }
          missing=0
          for m in $mods core-ios; do
            if [ "$(grep -cFx "      - \"$m/**\"" .github/workflows/ios.yml)" -ne 2 ]; then
              echo "::error file=.github/workflows/ios.yml::$m/** is not in both iOS path filters"
              missing=1
            fi
          done
          exit $missing
      # Every Android or iOS screen and platform log tag has a row in docs/parity.md, and a row where
      # one platform lacks the feature names its Jira issue (FBBD-361).
      - name: Feature parity matrix
        run: python3 tools/parity/check.py

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Report every failing check, not only the first one.
      fail-fast: false
      matrix:
        include:
          # Also compares the screenshot tests of core-ui and feature-track
          # with their goldens (screenshots.yml records them).
          - name: Unit tests
            tasks: test -Proborazzi.test.verify=true
            robolectric: true
          - name: Android lint
            tasks: lint
          - name: detekt
            tasks: detekt
          # assemble builds the debug and release variants of every module;
          # the release build also runs lintVitalRelease.
          - name: Build APKs
            tasks: assemble
            apk: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count (git rev-list --count HEAD),
          # which needs the full history. Only the APK job stamps it; the
          # other jobs use a shallow clone and the default build number 1.
          # (A quoted '0': a bare 0 is falsy and would select 1.)
          fetch-depth: ${{ matrix.apk && '0' || '1' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Also validates the Gradle wrapper jar. Caches are written on main
      # and read by pull requests.
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads its Android framework jar on the first run.
      - uses: actions/cache@v4
        if: matrix.robolectric
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', '**/robolectric.properties') }}
      - name: Build number
        id: build
        if: matrix.apk
        run: echo "args=-Pbetterdriver.build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }} ${{ steps.build.outputs.args }} --continue --stacktrace
      # Failed tests as annotations on the run, readable without the log.
      - name: Annotate failed tests
        if: failure() && matrix.robolectric
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      text = (bad.get('message') or bad.text or '').strip().replace('\n', ' ')[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      # The coach on every lap of Arek's built-in Silesia Ring and Jastrząb drives (DemoDriveReplayTest), and the
      # getting-faster loop over his real track days (GettingFasterLoopTest, FBBD-311), on the summary page.
      - name: Coach replay report
        if: always() && matrix.robolectric
        run: cat analysis/build/reports/replay-drive/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.name }}
          # Roborazzi writes the actual and diff images of failed screenshots to build/outputs/roborazzi.
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7
      # Pictures of the main screens on phone and tablet from the layout tests (FBBD-40), to look
      # at; the tests themselves check them, so they have no goldens.
      - name: Upload layout screenshots
        if: always() && matrix.robolectric
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: '**/build/outputs/roborazzi/layout/'
          if-no-files-found: ignore
          retention-days: 14
      # Pull requests do not keep the APK; run CI manually on a branch to get one.
      - name: Upload the debug APK
        if: matrix.apk && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: betterdriver-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Emulator smoke tests (FBBD-161): boots an Android 14 emulator, installs the
  # debug app on realistic seeded data (no Bluetooth, GPS or camera), opens
  # every screen and the 0.3.0 flows, and fails on any crash or ANR. Runs
  # beside the checks above; one emulator and one Gradle invocation. Then it
  # kills the UI process during a recording (FBBD-72, ui-kill.sh), injects
  # faults into a recording (FBBD-34, 69, 43, 64, 63, faults.sh) and runs the
  # permissions flow (FBBD-35, permissions.sh).
  #
  # Two emulators side by side (PART in emulator-smoke.sh): the Gradle smoke
  # tests on one, the kill, fault and permission scripts on the other.
  emulator:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Emulator smoke tests
            part: tests
          - name: Emulator faults and permissions
            part: faults
    env:
      AVD_KEY: avd-34-google_apis-x86_64-pixel_6-v1
      APK_BUILD_IN_BACKGROUND: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Gradle builds the app and test APKs while the emulator is restored and
      # boots; the scripts wait for it (wait-apk-build.sh).
      - name: Build the app and test APKs (in the background)
        run: |
          mkdir -p build
          nohup bash -c './gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace > build/apk-build.log 2>&1; echo $? > build/apk-build.status' >/dev/null 2>&1 &
      # Hardware acceleration for the emulator, as the emulator runner's README says.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs the system image itself, with no retry, and Google's download now and
      # then arrives broken ("Error on ZipFile unknown archive"). Installed here first, up to four tries;
      # the runner then finds it in place.
      - name: System image
        run: |
          for i in 1 2 3 4; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-34;google_apis;x86_64' > /dev/null && break
            echo "System image download failed (try $i)"
            sleep $((i * 10))
          done
      # The AVD and its booted snapshot, so later runs skip the cold boot.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Created the AVD snapshot for the cache."
      - name: Smoke tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: PART=${{ matrix.part }} bash .github/scripts/emulator-smoke.sh
      - name: Upload logcat and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ matrix.part }}
          path: |
            build/emulator/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/apk-build.log
          retention-days: 7

  # Arek's Demo track drive, done by CI instead of by him (FBBD-192): the Silesia Ring laps built into
  # the app (his 27 Sep 2026 sessions) replayed through the whole app on an emulator for 10 minutes,
  # coach at Full in Polish knowing the track from an earlier outing, then the app's continuous log checked as his shared logs are: the drive
  # checks and what the coach said lap by lap (FBBD-244, 242, 243, 245, 177). replay-drive.sh; the report
  # is on the run's summary page and in the replay-drive artifact.
  replay:
    name: Replay drive
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AVD_KEY: avd-34-google_apis-x86_64-pixel_6-v1
      APK_BUILD_IN_BACKGROUND: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Built while the emulator is restored and boots; replay-drive.sh waits for it.
      - name: Build the app and test APKs (in the background)
        run: |
          mkdir -p build
          nohup bash -c './gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace > build/apk-build.log 2>&1; echo $? > build/apk-build.status' >/dev/null 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs the system image itself, with no retry, and Google's download now and
      # then arrives broken ("Error on ZipFile unknown archive"). Installed here first, up to four tries;
      # the runner then finds it in place.
      - name: System image
        run: |
          for i in 1 2 3 4; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-34;google_apis;x86_64' > /dev/null && break
            echo "System image download failed (try $i)"
            sleep $((i * 10))
          done
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: echo "Created the AVD snapshot for the cache."
      - name: Replay drive
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/replay-drive.sh
      - name: Upload the report, log and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-drive
          path: |
            build/replay-drive/
            build/apk-build.log
          if-no-files-found: ignore
          retention-days: 14

  # One result for the whole run, named after the source tree it checked. A
  # release of a commit with that same tree (a pull request squash-merged while
  # up to date with main) reuses this result instead of waiting for main's run
  # (release.yml, ci-green). Skipped emulator jobs (docs only) count as passed.
  passed:
    name: CI passed (tree ${{ needs.changes.outputs.tree }})
    needs: [changes, check, emulator, replay]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A CI job ended $r."; exit 1 ;; esac
          done
