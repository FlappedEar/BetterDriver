# XcodeGen spec for the iOS/iPadOS app (FBBD-329). The Xcode project is generated, never
# committed: run ./generate.sh (see README.md).
name: BetterDriver
options:
  bundleIdPrefix: com.flappedear
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # From gradle.properties betterdriver.version (generate.sh), as the Android app.
    MARKETING_VERSION: ${BETTERDRIVER_VERSION}
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  BetterDriver:
    type: application
    platform: iOS
    sources:
      - BetterDriver
      # The Android app's track screen fonts (core-ui) and circuit directory (timing, FBBD-79),
      # copied into the app bundle; TrackFonts registers the fonts at launch.
      - path: ../core-ui/src/main/res/font
        buildPhase: resources
      - path: ../timing/src/main/resources/circuits/circuits.json
        buildPhase: resources
    dependencies:
      - framework: ../core-ios/build/XCFrameworks/${BETTERDRIVER_CORE_BUILD}/BetterDriverCore.xcframework
        embed: false
      # The recording's Live Activity on the lock screen (UI-284 A).
      - target: BetterDriverLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flappedear.betterdriver
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        PRODUCT_NAME: BetterDriver
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Background modes and document types; Xcode merges the generated keys below into it.
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BetterDriver
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: BetterDriver reads your RaceBox over Bluetooth while it records.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: BetterDriver records your position on track when no GPS receiver is connected.
        INFOPLIST_KEY_NSCameraUsageDescription: BetterDriver films your session with the phone camera, in sync with the data.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: BetterDriver records the sound with the session video.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Android app's icon (UI-18 A), rendered from app/src/main/res/drawable/ic_launcher_foreground.xml.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Standard HTTPS/TLS only, so TestFlight builds skip the export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        # Your team for device runs (generate.sh: BETTERDRIVER_TEAM); CI passes its own.
        DEVELOPMENT_TEAM: ${BETTERDRIVER_TEAM}
        # Load every Objective-C class of the static Kotlin framework, so the hosted unit tests
        # find the core's classes in the app even when the app itself does not use them yet.
        OTHER_LDFLAGS: $(inherited) -ObjC
  BetterDriverLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      # The activity's data, shared with the app.
      - BetterDriver/Recording/RecordingAttributes.swift
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: BetterDriver
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flappedear.betterdriver.LiveActivity
        PRODUCT_NAME: BetterDriverLiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${BETTERDRIVER_TEAM}
        SKIP_INSTALL: YES
  BetterDriverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BetterDriverTests
    dependencies:
      - target: BetterDriver
      # Headers only: the core's code is in the host app (one Kotlin runtime per process).
      - framework: ../core-ios/build/XCFrameworks/${BETTERDRIVER_CORE_BUILD}/BetterDriverCore.xcframework
        embed: false
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flappedear.betterdriver.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BetterDriver:
    build:
      targets:
        BetterDriver: all
        BetterDriverTests: [test]
    test:
      targets:
        - BetterDriverTests
